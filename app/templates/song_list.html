{% extends "base.html" %}

{% block title %}Song List - Eurovision Voting 2026{% endblock %}

{% block content %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark bg-opacity-75">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">🎵 Eurovision 2026</span>
        <div class="navbar-text text-light">
            Voter: <strong>{{ username }}</strong>
        </div>
    </div>
</nav>

<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex gap-2 justify-content-between align-items-center">
                <h2 class="mb-0">🎤 Tonight's Songs</h2>
                <div>
                    <a href="/mgp/{{ username }}/results" class="btn btn-info">📊 View Results</a>
                    <a href="/" class="btn btn-secondary">🚪 Change Voter</a>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        {% for song in songs %}
        <div class="col-lg-6 mb-4">
            {% include "partials/song_card.html" %}
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
